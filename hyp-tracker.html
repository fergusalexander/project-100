<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Body Hypertrophy Block</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f0; --bg2: #eeecea; --bg3: #e5e2dc; --card: #ffffff;
  --text: #1c1916; --text2: #6b6560; --text3: #a09a94;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
  --iron: #2c3e50; --iron-light: #d5dce4;
  --gold: #b8860b; --gold-light: #fdf3d0;
  --moss: #3d6b35; --moss-light: #e2f0df;
  --slate: #4a5568; --slate-light: #edf2f7;
  --teal: #1D9E75; --orange: #d85a30;
  --squat: #6b3fa0; --squat-light: #ede8f7;
  --dead: #a03f3f; --dead-light: #f7e8e8;
  --radius: 8px; --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141210; --bg2: #1c1916; --bg3: #242018; --card: #1e1b18;
    --text: #f0ece6; --text2: #8c8680; --text3: #5c5650;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --iron: #7fa3c0; --iron-light: #0d1e2e;
    --gold: #f0c040; --gold-light: #2a2010;
    --moss: #6aad60; --moss-light: #1a2e18;
    --slate: #94a3b8; --slate-light: #1e2533;
    --squat: #a880e0; --squat-light: #1e1030;
    --dead: #e08080; --dead-light: #2e1010;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
.layout { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

/* Header */
.header { margin-bottom: 24px; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--iron); margin-bottom: 3px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.page-meta { font-size: 13px; color: var(--text2); margin-top: 3px; }
.phase-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.phase-pill { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 999px; }
.pp-lower  { background: var(--squat-light); color: var(--squat); }
.pp-upper  { background: var(--iron-light);  color: var(--iron); }
.pp-full   { background: var(--moss-light);  color: var(--moss); }
.pp-done   { background: var(--bg3); color: var(--text3); }

/* Status */
.status-bar { display: flex; align-items: center; justify-content: space-between; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 18px; font-size: 12px; color: var(--text2); flex-wrap: wrap; gap: 8px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; background: var(--moss); }
.sdot.saving { background: var(--orange); animation: pulse .8s infinite; }
.sdot.err { background: #b44; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px 15px; box-shadow: var(--shadow); }
.stat-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 5px; }
.stat-val { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.stat-bar { height: 3px; background: var(--bg3); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.stat-bar-fill { height: 100%; background: var(--iron); border-radius: 2px; transition: width .5s; }

/* Section title */
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); margin: 20px 0 10px; }

/* Lift cards */
.lift-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.lift-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 13px 15px; box-shadow: var(--shadow); }
.lift-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.lift-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.li-bench { background: var(--iron-light); }
.li-squat { background: var(--squat-light); }
.li-dead  { background: var(--dead-light); }
.lift-card-title { font-size: 13px; font-weight: 600; }
.lift-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
.lift-row:last-child { border-bottom: none; }
.lift-row-label { font-size: 12px; color: var(--text2); }
.lift-row-val { display: flex; align-items: center; gap: 6px; }
.lift-num { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lift-input { font-size: 13px; padding: 3px 7px; border-radius: 6px; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); width: 72px; font-family: inherit; }
.lift-btn { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; }
.lift-btn:hover { background: var(--bg2); }
.delta { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.delta-better { background: var(--moss-light); color: var(--moss); }
.delta-same   { background: var(--bg3); color: var(--text3); }
.delta-lower  { background: #fce8e8; color: #922; }

/* Week tabs */
.week-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.wtab { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; transition: all .15s; }
.wtab.active { background: var(--iron); color: #fff; border-color: transparent; }
.wtab .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--moss); margin-left: 5px; vertical-align: middle; }

/* Sessions */
.session-list { display: flex; flex-direction: column; gap: 8px; }
.srow { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 11px 13px; box-shadow: var(--shadow); }
.srow.done { background: var(--bg2); box-shadow: none; }
.srow.skipped { opacity: .4; box-shadow: none; }
.srow-top { display: grid; grid-template-columns: 62px 1fr auto; align-items: start; gap: 10px; }
.sday { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); padding-top: 2px; }
.sname { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.srow.done .sname { text-decoration: line-through; color: var(--text2); }
.sdesc { font-size: 12px; color: var(--text2); margin-top: 3px; }
.sdetail { font-size: 12px; color: var(--text2); margin-top: 6px; background: var(--bg2); border-radius: var(--radius); padding: 8px 10px; line-height: 1.6; }
.tag { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.t-lower { background: var(--squat-light); color: var(--squat); }
.t-upper { background: var(--iron-light); color: var(--iron); }
.t-full  { background: var(--moss-light); color: var(--moss); }
.t-rest  { background: var(--slate-light); color: var(--slate); }
.action-btns { display: flex; gap: 5px; padding-top: 1px; flex-shrink: 0; }
.abtn { font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; transition: all .15s; white-space: nowrap; }
.abtn:hover { background: var(--bg2); }
.abtn.done-btn:hover { background: var(--moss-light); color: var(--moss); border-color: transparent; }
.abtn.skip-btn:hover { background: #fce8e8; color: #922; border-color: transparent; }

/* Log panel — appears when tapping Done */
.log-panel { margin-top: 10px; background: var(--bg2); border-radius: var(--radius); padding: 10px 12px; display: none; }
.log-panel.open { display: block; }
.log-panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 8px; }
.log-lift-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.log-lift-row { display: flex; align-items: center; gap: 8px; }
.log-lift-name { font-size: 12px; color: var(--text2); width: 100px; flex-shrink: 0; }
.log-lift-planned { font-size: 12px; color: var(--text3); flex: 1; }
.log-lift-input { font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 6px; border: 0.5px solid var(--border2); background: var(--card); color: var(--text); width: 76px; font-family: inherit; font-variant-numeric: tabular-nums; }
.log-lift-unit { font-size: 12px; color: var(--text3); }
.log-actions { display: flex; gap: 6px; }
.log-save-btn { font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 6px; border: none; background: var(--iron); color: #fff; cursor: pointer; }
.log-save-btn:hover { opacity: .85; }
.log-skip-link { font-size: 12px; color: var(--text3); padding: 5px 8px; cursor: pointer; border-radius: 6px; border: none; background: transparent; font-family: inherit; }
.log-skip-link:hover { color: var(--text2); background: var(--bg3); }

/* Actual weights logged on done sessions */
.sactual { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.sactual-chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }
.sac-bench { background: var(--iron-light); color: var(--iron); }
.sac-squat { background: var(--squat-light); color: var(--squat); }
.sac-dead  { background: var(--dead-light); color: var(--dead); }
.sac-other { background: var(--bg3); color: var(--text2); }

/* Week summary */
.week-summary { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 13px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.week-focus { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.week-note { font-size: 12px; color: var(--text2); line-height: 1.5; }

/* Loading */
.loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
.loading-wave { font-size: 32px; margin-bottom: 10px; text-align: center; animation: wave 1.5s ease-in-out infinite; }
.loading-text { font-size: 13px; color: var(--text2); text-align: center; }
@keyframes wave { 0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)} }

@media(max-width:600px){
  .lift-grid { grid-template-columns: 1fr; }
  .srow-top { grid-template-columns: 50px 1fr; }
  .action-btns { grid-column: 2; }
  .log-lift-row { flex-wrap: wrap; }
  .log-lift-name { width: 80px; }
}
</style>
</head>

       detail:"Bench press: 4×8 @ 85kg — big working weight relative to your 100kg 1RM\nOverhead press: 4×8 heaviest\nBent-over row: 4×8 heaviest\nWeighted pull-ups: 3×6\nTricep work: 3×12\nFace pulls: 3×15"},
      {day:"Fri", type:"full", name:"Full Body — Block finisher",
       desc:"4×5 deadlift heavy · full body finisher · log everything",
       lifts:[{name:"Deadlift",planned:132.5,ltype:"dead"},{name:"Incline DB press",planned:38,ltype:"bench"}],
       detail:"Conventional deadlift: 4×5 @ 130–135kg — log this carefully, it's your new baseline\nIncline DB press: 3×10\nFront squat: 3×8\nDB row: 3×12\nBicep / tricep superset: 3×12\n\nAfter this session: your working weights here are the baselines for the next peaking block."},
    ]
  },
];

const TAG = {lower:"t-lower", upper:"t-upper", full:"t-full", rest:"t-rest"};

// ── State ─────────────────────────────────────────────────────────────────────
let sessionStatus = {};   // key → "done" | "skip" | "pending"
let sessionData   = {};   // key → {liftName: actualKg, ...}
let lifts = {
  bench_start:"100", bench_end:"",
  squat_start:"80",  squat_end:"",
  dead_start:"110",  dead_end:"",
};
let currentWeek = 1;
let logOpen = null; // key of currently open log panel

// ── Status bar ────────────────────────────────────────────────────────────────
function setStatus(state, msg, right="") {
  document.getElementById("sdot").className = "sdot"+(state==="saving"?" saving":state==="err"?" err":"");
  document.getElementById("stxt").textContent = msg;
  document.getElementById("sright").textContent = right;
}

// ── Supabase ──────────────────────────────────────────────────────────────────
async function loadFromSupabase() {
  try {
    const [sRes, dRes, bRes] = await Promise.all([
      db.from("hyp_sessions").select("*"),
      db.from("hyp_session_data").select("*"),
      db.from("hyp_lifts").select("*"),
    ]);
    sessionStatus = {};
    (sRes.data||[]).forEach(r => sessionStatus[r.key] = r.status);
    sessionData = {};
    (dRes.data||[]).forEach(r => {
      if (!sessionData[r.session_key]) sessionData[r.session_key] = {};
      sessionData[r.session_key][r.lift_name] = parseFloat(r.actual_kg);
    });
    (bRes.data||[]).forEach(r => lifts[r.name] = r.value);
    setStatus("ok","Connected · Supabase","Loaded "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) {
    console.error(e);
    setStatus("err","Supabase error",e.message||"");
  }
}

async function upsertSession(key, status) {
  setStatus("saving","Saving…");
  try {
    const {error} = await db.from("hyp_sessions").upsert({key,status},{onConflict:"key"});
    if (error) throw error;
    setStatus("ok","Connected · Supabase","Saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) { setStatus("err","Save failed",e.message); }
}

async function upsertSessionData(sessionKey, liftName, actualKg) {
  setStatus("saving","Saving…");
  try {
    const {error} = await db.from("hyp_session_data").upsert(
      {session_key: sessionKey, lift_name: liftName, actual_kg: actualKg},
      {onConflict:"session_key,lift_name"}
    );
    if (error) throw error;
    setStatus("ok","Connected · Supabase","Saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) { setStatus("err","Save failed",e.message); }
}

async function upsertLift(name, value) {
  setStatus("saving","Saving…");
  try {
    const {error} = await db.from("hyp_lifts").upsert({name,value},{onConflict:"name"});
    if (error) throw error;
    setStatus("ok","Connected · Supabase","Saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) { setStatus("err","Save failed",e.message); }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function calcStats() {
  let total=0, done=0;
  WEEKS.forEach(w=>w.sessions.forEach((s,i)=>{
    total++;
    if(sessionStatus[`w${w.num}_d${i}`]==="done") done++;
  }));
  return {total,done,pct:total?Math.round(done/total*100):0};
}

function renderStats() {
  const s = calcStats();
  const daysLeft = Math.max(0, Math.ceil((new Date("2026-11-14") - new Date()) / 86400000));
  document.getElementById("stat-grid").innerHTML=`
    <div class="stat"><div class="stat-label">Sessions done</div><div class="stat-val">${s.done}<span style="font-size:15px;font-weight:400;color:var(--text3)">/${s.total}</span></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${s.pct}%"></div></div></div>
    <div class="stat"><div class="stat-label">Completion</div><div class="stat-val">${s.pct}<span style="font-size:15px;font-weight:400;color:var(--text3)">%</span></div></div>
    <div class="stat"><div class="stat-label">Current week</div><div class="stat-val">${Math.min(6,Math.max(1,currentWeek))}<span style="font-size:15px;font-weight:400;color:var(--text3)">/6</span></div></div>
    <div class="stat"><div class="stat-label">Days left</div><div class="stat-val">${daysLeft}</div></div>
  `;
}

// ── Lift summary cards ────────────────────────────────────────────────────────
function liftRowHtml(label, key, baseVal) {
  const val = lifts[key];
  if (val) {
    const d = parseFloat(val) - parseFloat(baseVal||0);
    const dHtml = d > 0 ? `<span class="delta delta-better">+${d}kg</span>` : d < 0 ? `<span class="delta delta-lower">${d}kg</span>` : "";
    return `<div class="lift-row"><span class="lift-row-label">${label}</span><div class="lift-row-val"><span class="lift-num">${val}kg</span>${dHtml}<button class="lift-btn" onclick="clearLift('${key}')">edit</button></div></div>`;
  }
  return `<div class="lift-row"><span class="lift-row-label">${label}</span><div class="lift-row-val"><input class="lift-input" type="number" id="l_${key}" placeholder="kg"><button class="lift-btn" onclick="saveLift('${key}')">Save</button></div></div>`;
}

function renderLiftGrid() {
  document.getElementById("lift-grid").innerHTML = `
    <div class="lift-card">
      <div class="lift-header"><div class="lift-icon li-bench">🏋️</div><span class="lift-card-title">Bench</span></div>
      <div class="lift-row"><span class="lift-row-label">Start</span><div class="lift-row-val"><span class="lift-num">100kg ✓</span></div></div>
      ${liftRowHtml("End of block","bench_end","100")}
    </div>
    <div class="lift-card">
      <div class="lift-header"><div class="lift-icon li-squat">🦵</div><span class="lift-card-title">Squat</span></div>
      <div class="lift-row"><span class="lift-row-label">Estimate</span><div class="lift-row-val"><span class="lift-num">~115kg</span></div></div>
      ${liftRowHtml("End of block","squat_end","115")}
    </div>
    <div class="lift-card">
      <div class="lift-header"><div class="lift-icon li-dead">⬆️</div><span class="lift-card-title">Deadlift</span></div>
      <div class="lift-row"><span class="lift-row-label">Last 1RM</span><div class="lift-row-val"><span class="lift-num">160kg</span></div></div>
      ${liftRowHtml("End of block","dead_end","160")}
    </div>
  `;
}

window.saveLift = async function(key) {
  const v = document.getElementById("l_"+key)?.value?.trim();
  if (!v) return;
  lifts[key] = v; renderLiftGrid(); await upsertLift(key, v);
};
window.clearLift = function(key) { lifts[key]=""; renderLiftGrid(); };

// ── Week nav ──────────────────────────────────────────────────────────────────
function renderWeekNav() {
  document.getElementById("week-nav").innerHTML = WEEKS.map(w => {
    const done = w.sessions.filter((_,i)=>sessionStatus[`w${w.num}_d${i}`]==="done").length;
    return `<button class="wtab${w.num===currentWeek?" active":""}" onclick="setWeek(${w.num})">${w.label}${done?`<span class="dot"></span>`:""}</button>`;
  }).join("");
}
window.setWeek = function(n) { currentWeek=n; logOpen=null; renderWeekNav(); renderWeekSummary(); renderSessions(); };

function renderWeekSummary() {
  const w = WEEKS.find(x=>x.num===currentWeek);
  const cls = {Establish:"pp-lower",Build:"pp-full",Intensify:"pp-upper"}[w.phase]||"pp-done";
  document.getElementById("week-summary").innerHTML = `
    <div class="week-focus"><span class="phase-pill ${cls}" style="font-size:11px;padding:2px 9px;margin-right:8px">${w.phase}</span>${w.dates}</div>
    <div class="week-note">${w.note}</div>
  `;
}

// ── Delta chip ────────────────────────────────────────────────────────────────
function deltaChip(planned, actual) {
  const d = actual - planned;
  if (Math.abs(d) < 0.1) return `<span class="delta delta-same">on plan</span>`;
  if (d > 0) return `<span class="delta delta-better">+${d}kg</span>`;
  return `<span class="delta delta-lower">${d}kg</span>`;
}

// ── Actual weights chips (shown on done sessions) ─────────────────────────────
function actualChipsHtml(key, liftDefs) {
  const data = sessionData[key];
  if (!data || !Object.keys(data).length) return "";
  return `<div class="sactual">${liftDefs.map(l => {
    const actual = data[l.name];
    if (actual === undefined) return "";
    return `<span class="sactual-chip sac-${l.ltype}">${l.name}: ${actual}kg ${deltaChip(l.planned, actual)}</span>`;
  }).join("")}</div>`;
}

// ── Log panel HTML ────────────────────────────────────────────────────────────
function logPanelHtml(key, liftDefs) {
  const rows = liftDefs.map(l =>
    `<div class="log-lift-row">
      <span class="log-lift-name">${l.name}</span>
      <span class="log-lift-planned">planned: ${l.planned}kg</span>
      <input class="log-lift-input" type="number" id="log_${key}_${l.name.replace(/\s/g,'_')}" placeholder="${l.planned}" step="0.5">
      <span class="log-lift-unit">kg</span>
    </div>`
  ).join("");
  return `<div class="log-panel${logOpen===key?" open":""}" id="logpanel_${key}">
    <div class="log-panel-title">Log what you lifted</div>
    <div class="log-lift-rows">${rows}</div>
    <div class="log-actions">
      <button class="log-save-btn" onclick="saveLog('${key}')">Save & mark done</button>
      <button class="log-skip-link" onclick="skipLog('${key}')">Mark done without logging</button>
    </div>
  </div>`;
}

// ── Sessions ──────────────────────────────────────────────────────────────────
function renderSessions() {
  const w = WEEKS.find(x=>x.num===currentWeek);
  document.getElementById("session-list").innerHTML = w.sessions.map((s,i) => {
    const key = `w${w.num}_d${i}`;
    const status = sessionStatus[key]||"pending";
    const isDone = status==="done", isSkip = status==="skip";
    const detailHtml = s.detail ? `<div class="sdetail">${s.detail.replace(/\n/g,"<br>")}</div>` : "";

    let btns, extra = "";
    if (status === "pending") {
      btns = `<div class="action-btns">
        <button class="abtn done-btn" onclick="openLog('${key}')">✓ Done</button>
        <button class="abtn skip-btn" onclick="markSession('${key}','skip')">Skip</button>
      </div>`;
      extra = logPanelHtml(key, s.lifts||[]);
    } else {
      btns = `<div class="action-btns"><button class="abtn" onclick="undoSession('${key}')">Undo</button></div>`;
      extra = isDone ? actualChipsHtml(key, s.lifts||[]) : "";
    }

    return `<div class="srow${isDone?" done":""}${isSkip?" skipped":""}" id="srow_${key}">
      <div class="srow-top">
        <span class="sday">${s.day}</span>
        <div><div class="sname"><span class="tag ${TAG[s.type]||"t-rest"}">${s.type}</span>${s.name}</div><div class="sdesc">${s.desc}</div>${detailHtml}</div>
        ${btns}
      </div>
      ${extra}
    </div>`;
  }).join("");
}

// ── Log interactions ──────────────────────────────────────────────────────────
window.openLog = function(key) {
  if (logOpen && logOpen !== key) {
    document.getElementById("logpanel_"+logOpen)?.classList.remove("open");
  }
  logOpen = key;
  document.getElementById("logpanel_"+key)?.classList.add("open");
};

window.saveLog = async function(key) {
  const w = WEEKS.find(w => w.sessions.some((_,i) => `w${w.num}_d${i}` === key));
  const si = w?.sessions.findIndex((_,i) => `w${w.num}_d${i}` === key);
  const liftDefs = w?.sessions[si]?.lifts || [];

  // Collect entered values
  const saves = [];
  liftDefs.forEach(l => {
    const inputId = `log_${key}_${l.name.replace(/\s/g,'_')}`;
    const el = document.getElementById(inputId);
    const val = parseFloat(el?.value);
    if (!isNaN(val) && val > 0) {
      if (!sessionData[key]) sessionData[key] = {};
      sessionData[key][l.name] = val;
      saves.push(upsertSessionData(key, l.name, val));
    }
  });

  sessionStatus[key] = "done";
  logOpen = null;
  renderAll();
  await Promise.all([upsertSession(key, "done"), ...saves]);
};

window.skipLog = async function(key) {
  sessionStatus[key] = "done";
  logOpen = null;
  renderAll();
  await upsertSession(key, "done");
};

window.markSession = async function(key, status) {
  sessionStatus[key] = status; logOpen = null; renderAll(); await upsertSession(key, status);
};

window.undoSession = async function(key) {
  sessionStatus[key] = "pending"; logOpen = null; renderAll(); await upsertSession(key, "pending");
};

// ── Auto week ─────────────────────────────────────────────────────────────────
function autoWeek() {
  const starts = [
    new Date("2026-10-06"), new Date("2026-10-13"), new Date("2026-10-20"),
    new Date("2026-10-27"), new Date("2026-11-03"), new Date("2026-11-10"),
  ];
  const today = new Date();
  for (let i=starts.length-1;i>=0;i--) { if(today>=starts[i]){currentWeek=i+1;break;} }
}

function renderAll() {
  renderStats(); renderLiftGrid(); renderWeekNav(); renderWeekSummary(); renderSessions();
}

(async()=>{
  autoWeek();
  await loadFromSupabase();
  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="block";
  renderAll();
})();
</script>
</body>
</html>
