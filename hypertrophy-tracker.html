<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f0; --bg2: #eeecea; --bg3: #e5e2dc; --card: #ffffff;
  --text: #1c1916; --text2: #6b6560; --text3: #a09a94;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);

  --gold: #b8860b; --gold-light: #fdf3d0;
  --moss: #3d6b35; --moss-light: #e2f0df;
  --slate: #4a5568; --slate-light: #edf2f7;
  --teal: #1D9E75; --orange: #d85a30;
  --squat: #6b3fa0; --squat-light: #ede8f7;
  --dead: #a03f3f; --dead-light: #f7e8e8;
  --radius: 8px; --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141210; --bg2: #1c1916; --bg3: #242018; --card: #1e1b18;
    --text: #f0ece6; --text2: #8c8680; --text3: #5c5650;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --iron: #7fa3c0; --iron-light: #0d1e2e;
    --gold: #f0c040; --gold-light: #2a2010;
    --moss: #6aad60; --moss-light: #1a2e18;
    --slate: #94a3b8; --slate-light: #1e2533;
    --squat: #a880e0; --squat-light: #1e1030;
    --dead: #e08080; --dead-light: #2e1010;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
.layout { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

/* Header */
.header { margin-bottom: 24px; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--iron); margin-bottom: 3px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.page-meta { font-size: 13px; color: var(--text2); margin-top: 3px; }
.phase-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.phase-pill { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 999px; }
.pp-lower  { background: var(--squat-light); color: var(--squat); }
.pp-upper  { background: var(--iron-light);  color: var(--iron); }
.pp-full   { background: var(--moss-light);  color: var(--moss); }
.pp-done   { background: var(--bg3); color: var(--text3); }

/* Status */
.status-bar { display: flex; align-items: center; justify-content: space-between; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 18px; font-size: 12px; color: var(--text2); flex-wrap: wrap; gap: 8px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; background: var(--moss); }
.sdot.saving { background: var(--orange); animation: pulse .8s infinite; }
.sdot.err { background: #b44; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }

/* Stats */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 13px 15px; box-shadow: var(--shadow); }
.stat-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 5px; }
.stat-val { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
.stat-bar { height: 3px; background: var(--bg3); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.stat-bar-fill { height: 100%; background: var(--iron); border-radius: 2px; transition: width .5s; }

/* Section title */
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); margin: 20px 0 10px; }

/* Lift benchmarks */
.lift-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.lift-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 13px 15px; box-shadow: var(--shadow); }
.lift-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.lift-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.li-bench { background: var(--iron-light); }
.li-squat { background: var(--squat-light); }
.li-dead  { background: var(--dead-light); }
.lift-card-title { font-size: 13px; font-weight: 600; }
.lift-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 0.5px solid var(--border); }
.lift-row:last-child { border-bottom: none; }
.lift-row-label { font-size: 12px; color: var(--text2); }
.lift-row-val { display: flex; align-items: center; gap: 6px; }
.lift-time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lift-input { font-size: 13px; padding: 3px 7px; border-radius: 6px; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); width: 72px; font-family: inherit; }
.lift-btn { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; }
.lift-btn:hover { background: var(--bg2); }
.delta { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.delta-better { background: var(--moss-light); color: var(--moss); }

/* Week tabs */
.week-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.wtab { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; transition: all .15s; }
.wtab.active { background: var(--iron); color: #fff; border-color: transparent; }
.wtab .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--moss); margin-left: 5px; vertical-align: middle; }
.wtab .phase-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }

/* Sessions */

.srow { display: grid; grid-template-columns: 62px 1fr auto; align-items: start; gap: 10px; background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 11px 13px; box-shadow: var(--shadow); }
.srow.done { background: var(--bg2); box-shadow: none; }
.srow.done .sname { text-decoration: line-through; color: var(--text2); }
.srow.skipped { opacity: .4; box-shadow: none; }

.sname { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sdesc { font-size: 12px; color: var(--text2); margin-top: 3px; }
.sdetail { font-size: 12px; color: var(--text2); margin-top: 6px; background: var(--bg2); border-radius: var(--radius); padding: 8px 10px; line-height: 1.6; }
.tag { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.t-lower { background: var(--squat-light); color: var(--squat); }
.t-upper { background: var(--iron-light); color: var(--iron); }
.t-full  { background: var(--moss-light); color: var(--moss); }
.t-rest  { background: var(--slate-light); color: var(--slate); }

.abtn.done-btn:hover { background: var(--moss-light); color: var(--moss); border-color: transparent; }
.abtn.skip-btn:hover { background: #fce8e8; color: #922; border-color: transparent; }

/* Progress bars */

.prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.prog-row:last-child { margin-bottom: 0; }
.prog-label { font-size: 12px; color: var(--text2); width: 70px; flex-shrink: 0; }
.prog-bg { flex: 1; height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width .4s; }
.prog-pct { font-size: 12px; font-weight: 600; width: 32px; text-align: right; }

/* Loading */
.loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
.loading-wave { font-size: 32px; margin-bottom: 10px; text-align: center; animation: wave 1.5s ease-in-out infinite; }
.loading-text { font-size: 13px; color: var(--text2); text-align: center; }
@keyframes wave { 0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)} }

/* Week summary card */
.week-summary { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 13px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.week-focus { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.week-note { font-size: 12px; color: var(--text2); line-height: 1.5; }

@media(max-width:600px){
  .lift-grid { grid-template-columns: 1fr; }
  .srow { grid-template-columns: 50px 1fr; }
  .action-btns { grid-column: 2; }
}

const TAG = {lower:"t-lower", upper:"t-upper", full:"t-full", rest:"t-rest"};

// ── State ─────────────────────────────────────────────────────────────────────
let sessions = {};

  squat_start: "80",  squat_end: "",
  dead_start:  "110", dead_end: "",

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(state, msg, right="") {
  const dot = document.getElementById("sdot");
  dot.className = "sdot"+(state==="saving"?" saving":state==="err"?" err":"");
  document.getElementById("stxt").textContent = msg;
  document.getElementById("sright").textContent = right;
}

// ── Supabase ──────────────────────────────────────────────────────────────────
async function loadFromSupabase() {
  try {
    const [sRes, bRes] = await Promise.all([
      db.from("hyp_sessions").select("*"),
      db.from("hyp_lifts").select("*"),
    ]);
    sessions = {};
    (sRes.data||[]).forEach(r => sessions[r.key] = r.status);
    (bRes.data||[]).forEach(r => lifts[r.name] = r.value);
    setStatus("ok","Connected · Supabase","Loaded "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) {
    console.error(e);
    setStatus("err","Supabase error — data saved locally only",e.message||"");
  }
}

async function upsertSession(key, status) {
  setStatus("saving","Saving…");
  try {
    const {error} = await db.from("hyp_sessions").upsert({key,status},{onConflict:"key"});
    if (error) throw error;
    setStatus("ok","Connected · Supabase","Saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) { setStatus("err","Save failed",e.message); }
}

async function upsertLift(name, value) {
  setStatus("saving","Saving…");
  try {
    const {error} = await db.from("hyp_lifts").upsert({name,value},{onConflict:"name"});
    if (error) throw error;
    setStatus("ok","Connected · Supabase","Saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  } catch(e) { setStatus("err","Save failed",e.message); }
}

  let total=0, done=0;
  WEEKS.forEach(w=>w.sessions.forEach((s,i)=>{
    if(s.type==="rest") return; total++;
    if(sessions[`w${w.num}_d${i}`]==="done") done++;
  }));
  return {total,done,pct:total?Math.round(done/total*100):0};
}

function renderStats() {
  const s = calcStats();
  const today = new Date();
  const endDate = new Date("2026-11-14");
  const daysLeft = Math.max(0, Math.ceil((endDate - today) / 86400000));
  const weekNum = Math.min(6, Math.max(1, currentWeek));
  document.getElementById("stat-grid").innerHTML=`
    <div class="stat"><div class="stat-label">Sessions done</div><div class="stat-val">${s.done}<span style="font-size:15px;font-weight:400;color:var(--text3)">/${s.total}</span></div><div class="stat-bar"><div class="stat-bar-fill" style="width:${s.pct}%"></div></div></div>
    <div class="stat"><div class="stat-label">Completion</div><div class="stat-val">${s.pct}<span style="font-size:15px;font-weight:400;color:var(--text3)">%</span></div></div>
    <div class="stat"><div class="stat-label">Current week</div><div class="stat-val">${weekNum}<span style="font-size:15px;font-weight:400;color:var(--text3)">/6</span></div></div>
    <div class="stat"><div class="stat-label">Days left</div><div class="stat-val">${daysLeft}</div></div>
  `;
}

// ── Lift cards ────────────────────────────────────────────────────────────────
function liftRowHtml(label, key, baseVal) {
  const val = lifts[key];
  if (val) {
    const delta = parseFloat(val) - parseFloat(baseVal||0);
    const deltaHtml = delta > 0 ? `<span class="delta delta-better">+${delta}kg</span>` : "";
    return `<div class="lift-row"><span class="lift-row-label">${label}</span><div class="lift-row-val"><span class="lift-time">${val}kg</span>${deltaHtml}<button class="lift-btn" onclick="clearLift('${key}')">edit</button></div></div>`;
  }
  return `<div class="lift-row"><span class="lift-row-label">${label}</span><div class="lift-row-val"><input class="lift-input" type="number" id="l_${key}" placeholder="kg"><button class="lift-btn" onclick="saveLift('${key}')">Save</button></div></div>`;
}

function renderLiftGrid() {
  document.getElementById("lift-grid").innerHTML = `
    <div class="lift-card">
      <div class="lift-header"><div class="lift-icon li-bench">🏋️</div><span class="lift-card-title">Bench</span></div>
      <div class="lift-row"><span class="lift-row-label">Start</span><div class="lift-row-val"><span class="lift-time">100kg ✓</span></div></div>
      ${liftRowHtml("End of block", "bench_end", lifts.bench_start)}
    </div>
    <div class="lift-card">
      <div class="lift-header"><div class="lift-icon li-squat">🦵</div><span class="lift-card-title">Squat</span></div>
      <div class="lift-row"><span class="lift-row-label">Estimate</span><div class="lift-row-val"><span class="lift-time">~115kg</span></div></div>
      ${liftRowHtml("End of block", "squat_end", "115")}
    </div>
    <div class="lift-card">
      <div class="lift-header"><div class="lift-icon li-dead">⬆️</div><span class="lift-card-title">Deadlift</span></div>
      <div class="lift-row"><span class="lift-row-label">Last 1RM</span><div class="lift-row-val"><span class="lift-time">160kg</span></div></div>
      ${liftRowHtml("End of block", "dead_end", "160")}
    </div>
  `;
}

window.saveLift = async function(key) {
  const v = document.getElementById("l_"+key)?.value?.trim();
  if (!v) return;
  lifts[key] = v;
  renderLiftGrid();
  await upsertLift(key, v);
};
window.clearLift = function(key) { lifts[key]=""; renderLiftGrid(); };

// ── Week tabs ─────────────────────────────────────────────────────────────────
const PHASE_COLORS = {Establish:"#2c3e50", Build:"#3d6b35", Intensify:"#b8860b"};

function renderWeekNav() {
  document.getElementById("week-nav").innerHTML = WEEKS.map(w => {
    const done = w.sessions.filter((_,i)=>sessions[`w${w.num}_d${i}`]==="done").length;
    const col = PHASE_COLORS[w.phase]||"var(--text3)";
    return `<button class="wtab${w.num===currentWeek?" active":""}" onclick="setWeek(${w.num})">
      ${w.label}${done?`<span class="dot"></span>`:""}
    </button>`;
  }).join("");
}
window.setWeek = function(n) { currentWeek=n; renderWeekNav(); renderWeekSummary(); renderSessions(); };

// ── Week summary ──────────────────────────────────────────────────────────────
function renderWeekSummary() {
  const w = WEEKS.find(x=>x.num===currentWeek);
  const phaseClass = {Establish:"pp-lower", Build:"pp-full", Intensify:"pp-upper"}[w.phase]||"pp-done";
  document.getElementById("week-summary").innerHTML = `
    <div class="week-focus"><span class="phase-pill ${phaseClass}" style="font-size:11px;padding:2px 9px;margin-right:8px">${w.phase}</span>${w.dates}</div>
    <div class="week-note">${w.note}</div>
  `;
}

// ── Sessions ──────────────────────────────────────────────────────────────────
function renderSessions() {
  const w = WEEKS.find(x=>x.num===currentWeek);
  document.getElementById("session-list").innerHTML = w.sessions.map((s,i) => {
    const key = `w${w.num}_d${i}`;
    const status = sessions[key]||"pending";
    const detailHtml = s.detail
      ? `<div class="sdetail">${s.detail.replace(/\n/g,"<br>")}</div>`
      : "";
    const btns = status==="pending"
      ? `<div class="action-btns"><button class="abtn done-btn" onclick="markSession('${key}','done')">✓ Done</button><button class="abtn skip-btn" onclick="markSession('${key}','skip')">Skip</button></div>`
      : `<div class="action-btns"><button class="abtn" onclick="markSession('${key}','pending')">Undo</button></div>`;
    return `<div class="srow${status==="done"?" done":""}${status==="skip"?" skipped":""}">
      <span class="sday">${s.day}</span>
      <div><div class="sname"><span class="tag ${TAG[s.type]||"t-rest"}">${s.type}</span>${s.name}</div><div class="sdesc">${s.desc}</div>${detailHtml}</div>
      ${btns}</div>`;
  }).join("");
}

window.markSession = async function(key, status) {
  sessions[key] = status; renderAll(); await upsertSession(key, status);
};

// ── Auto week ─────────────────────────────────────────────────────────────────
function autoWeek() {
  const starts = [
    new Date("2026-10-06"), new Date("2026-10-13"), new Date("2026-10-20"),
    new Date("2026-10-27"), new Date("2026-11-03"), new Date("2026-11-10"),
  ];
  const today = new Date();
  for (let i=starts.length-1;i>=0;i--) { if(today>=starts[i]){currentWeek=i+1;break;} }
}

function renderAll() {
  renderStats(); renderLiftGrid(); renderWeekNav(); renderWeekSummary(); renderSessions();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async()=>{
  autoWeek();
  await loadFromSupabase();
  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="block";
  renderAll();
})();
</script>
</body>
</html>
